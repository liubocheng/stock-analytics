<style>
:root {
  --bg: #f4f7fb;

  --ink: #0f172a;
  --muted: #5b6470;
  --accent: #1d4ed8;
  --accent-2: #e8f0ff;
  --border: #d7dee8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "PingFang HK", "PingFang SC", "Heiti TC", "Heiti SC", "STHeiti",
    "Arial Unicode MS", "Helvetica Neue", Arial, sans-serif; }
.page { max-width: 1100px; margin: 0 auto; padding: 24px 18px 48px; }
header { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 16px; }
.hero { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { background: var(--accent-2); color: var(--accent); border: 1px solid #cfe0ff; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
.h-title { font-size: 26px; font-weight: 700; margin-top: 10px; }
.h-sub { color: var(--muted); margin-top: 6px; }
.section { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.section h2 { margin: 0 0 10px; font-size: 18px; border-left: 4px solid var(--accent); padding-left: 8px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) {
  .grid { grid-template-columns: 1fr; }
}
.card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: #fbfdff; }
img { max-width: 100%; display: block; margin: 0 auto; border-radius: 8px; border: 1px solid #e4e8f0; }
.muted { color: var(--muted); font-size: 12px; line-height: 1.6; }
</style>
