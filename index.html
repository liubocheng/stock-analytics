<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>股票数据分析报告</title>
<style>
  :root {
    --bg:#f3f6fb;
    --panel:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --accent:#1d4ed8;
    --accent-2:#e8f0ff;
    --border:#d7dee8;
    --shadow: 0 8px 24px rgba(15,23,42,.08);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink);}

  .main { padding:16px 20px; }
  .topbar {
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .topbar > div:first-child { text-align:center; width:100%; }
  .title { font-size:20px; font-weight:700; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .badge { background:var(--accent-2); color:var(--accent); border:1px solid #cfe0ff;
           padding:4px 8px; border-radius:999px; font-size:12px; }
  .sub { color:var(--muted); font-size:12px; margin-top:6px; }

  .kpis { margin-top:12px; display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center; }
  .kpi .label { font-size:12px; color:var(--muted); }
  .kpi .value { font-size:16px; font-weight:700; color:var(--accent); margin-top:4px; }

  .section { margin-top:14px; }
  .section h2 {
    margin:0 0 8px; font-size:16px; font-weight:700;
    padding-left:10px; border-left:4px solid var(--accent);
  }

  .tabs { display:flex; gap:10px; margin-top:10px; }
  .tabs button {
    flex:1; padding:10px 12px; border-radius:999px;
    border:1px solid var(--border); background:#fff; cursor:pointer;
    font-size:14px; font-weight:600; color:#334155;
    box-shadow:0 1px 0 rgba(15,23,42,.04);
  }
  .tabs button.active {
    background:var(--accent); color:#fff; border-color:var(--accent);
    box-shadow:0 6px 14px rgba(29,78,216,.25);
  }

  .frame-wrap { margin-top:12px; height: calc(100vh - 220px); }
  iframe { width:100%; height:100%; border:none; display:none; border-radius:14px; background:#fff; box-shadow: var(--shadow); }
  iframe.active { display:block; }

  @media (max-width: 980px) {
    .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
</style>
</head>
<body>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="title">股票系统数据分析报告</div>
        <div class="sub">栏目：基础因子 / 进阶因子</div>
      </div>
      <div class="badges">
                <div class="badge">日线</div>
        <div class="badge">因子分析</div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="label">股票数量</div><div class="value">10</div></div>
      <div class="kpi"><div class="label">交易日数</div><div class="value">~252</div></div>
      <div class="kpi"><div class="label">平均换手率</div><div class="value">0.01+</div></div>
      <div class="kpi"><div class="label">示例股票</div><div class="value">STK0001</div></div>
    </div>

    <div class="section">
      <h2>报告切换</h2>
      <div class="tabs">
        <button class="tab active" data-target="basic">基础因子</button>
        <button class="tab" data-target="advanced">进阶因子</button>
      </div>
    </div>

    <div class="section">
      <h2>报告预览</h2>
      <div class="frame-wrap">
        <iframe id="basic" class="active" src="report_basic.html"></iframe>
        <iframe id="advanced" src="report_advanced.html"></iframe>
      </div>
    </div>
  </main>

<script>
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>
</body>
</html>
